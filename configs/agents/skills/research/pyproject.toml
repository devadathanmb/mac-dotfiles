[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-research-cli"
version = "0.1.0"
description = "Research docs, web pages, repositories, and public code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1",
    "html-to-markdown>=3,<4",
    "selectolax>=0.4,<1",
]

[project.scripts]
research = "research_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts/research_cli"]
