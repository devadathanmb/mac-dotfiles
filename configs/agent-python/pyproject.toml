[project]
name = "agent-python"
version = "0.1.0"
description = "Shared libraries for coding-agent scratch scripts"
requires-python = ">=3.15,<3.16"
dependencies = [
  "beautifulsoup4",
  "httpx2>=2.16,<3",
  "json5>=0.17.3",
  "lxml",
  "matplotlib",
  "numpy",
  "openpyxl>=3.1.5",
  "pandas",
  "pillow",
  "plotly",
  "pyarrow>=26.0.1",
  "pymupdf",
  "ruamel.yaml",
  "tabulate",
]

[tool.uv]
package = false
