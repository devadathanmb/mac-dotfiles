---
- name: Ensure private secret directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.secrets"
    state: directory
    mode: "0700"

- name: Ensure API key files exist
  ansible.builtin.copy:
    content: ""
    dest: "{{ home_dir }}/.secrets/{{ item }}"
    force: false
    mode: "0600"
  loop:
    - exa-api-key
    - context7-api-key
