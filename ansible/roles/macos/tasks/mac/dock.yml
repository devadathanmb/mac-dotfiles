---
# DOCK SETTINGS

- name: Dock | Read pinned applications
  ansible.builtin.command:
    argv: [dockutil, --list]
  register: dock_items
  changed_when: false
  check_mode: false

- name: Dock | Record pinned application names
  ansible.builtin.set_fact:
    current_dock_apps: "{{ dock_items.stdout_lines | map('regex_replace', '\t.*$', '') | list }}"
    expected_dock_apps: "{{ macos_dock_applications | map(attribute='name') | list }}"

- name: Dock | Remove unexpected pinned applications
  ansible.builtin.command:
    argv: [dockutil, --remove, all, --no-restart]
  when: current_dock_apps != expected_dock_apps
  changed_when: true
  notify: Restart Dock

- name: Dock | Add pinned applications in order
  ansible.builtin.command:
    argv: [dockutil, --add, "{{ item.path }}", --no-restart]
  loop: "{{ macos_dock_applications }}"
  loop_control:
    label: "{{ item.name }}"
  when: current_dock_apps != expected_dock_apps
  changed_when: true
  notify: Restart Dock

- name: Dock | Auto-hide Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide
    type: bool
    value: true
  notify: Restart Dock

- name: Dock | Set auto-hide animation speed
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide-time-modifier
    type: float
    value: 0.7
  notify: Restart Dock

- name: Dock | Change minimize/maximize window effect to genie
  community.general.osx_defaults:
    domain: com.apple.dock
    key: mineffect
    type: string
    value: genie
  notify: Restart Dock

- name: Dock | Minimize windows into their application icon
  community.general.osx_defaults:
    domain: com.apple.dock
    key: minimize-to-application
    type: bool
    value: true
  notify: Restart Dock

- name: Dock | Show indicator lights for open applications
  community.general.osx_defaults:
    domain: com.apple.dock
    key: show-process-indicators
    type: bool
    value: true
  notify: Restart Dock

- name: Dock | Show pinned and open applications
  community.general.osx_defaults:
    domain: com.apple.dock
    key: static-only
    type: bool
    value: false
  notify: Restart Dock

- name: Dock | Don't animate opening applications
  community.general.osx_defaults:
    domain: com.apple.dock
    key: launchanim
    type: bool
    value: false
  notify: Restart Dock

- name: Dock | Don't show recently used applications
  community.general.osx_defaults:
    domain: com.apple.dock
    key: show-recents
    type: bool
    value: false
  notify: Restart Dock

- name: Dock | Speed up Mission Control animations
  community.general.osx_defaults:
    domain: com.apple.dock
    key: expose-animation-duration
    type: float
    value: 0.1
  notify: Restart Dock

- name: Dock | Don't automatically rearrange Spaces
  community.general.osx_defaults:
    domain: com.apple.dock
    key: mru-spaces
    type: bool
    value: false
  notify: Restart Dock

- name: Dock | Set icon size
  community.general.osx_defaults:
    domain: com.apple.dock
    key: tilesize
    type: int
    value: 63
  notify: Restart Dock

- name: Dock | Disable magnification
  community.general.osx_defaults:
    domain: com.apple.dock
    key: magnification
    type: bool
    value: false
  notify: Restart Dock

- name: Dock | Don't group windows by app in Mission Control
  community.general.osx_defaults:
    domain: com.apple.dock
    key: expose-group-apps
    type: bool
    value: false
  notify: Restart Dock

- name: Dock | Enable Mission Control by dragging window to top
  community.general.osx_defaults:
    domain: com.apple.dock
    key: enterMissionControlByTopWindowDrag
    type: bool
    value: true
  notify: Restart Dock
