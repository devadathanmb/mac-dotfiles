---
# SYSTEM UI SETTINGS

- name: System UI | Show Wi-Fi in menu bar
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: NSStatusItem VisibleCC WiFi
    type: bool
    value: true
  notify: Restart SystemUIServer

- name: System UI | Show battery percentage in menu bar
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: BatteryShowPercentage
    type: bool
    value: true
    host: currentHost
  notify: Restart SystemUIServer

- name: System UI | Show Battery in menu bar
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: NSStatusItem VisibleCC Battery
    type: bool
    value: true
  notify: Restart SystemUIServer

- name: System UI | Show volume icon in menu bar
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: Sound
    type: int
    value: 18
    host: currentHost
  notify: Restart SystemUIServer

- name: System UI | Show Sound in menu bar
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: NSStatusItem VisibleCC Sound
    type: bool
    value: true
  notify: Restart SystemUIServer

- name: System UI | Show Bluetooth as active-only in menu bar
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: Bluetooth
    type: int
    value: 2
    host: currentHost
  notify: Restart SystemUIServer

- name: System UI | Show Bluetooth in menu bar
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: NSStatusItem VisibleCC Bluetooth
    type: bool
    value: true
  notify: Restart SystemUIServer

- name: System UI | Hide Display in menu bar
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: Display
    type: int
    value: 8
    host: currentHost
  notify: Restart SystemUIServer

- name: System UI | Hide Now Playing in menu bar
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: NowPlaying
    type: int
    value: 8
    host: currentHost
  notify: Restart SystemUIServer

- name: System UI | Hide Now Playing status item
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: NSStatusItem Visible NowPlaying
    type: bool
    value: false
  notify: Restart SystemUIServer

- name: System UI | Hide Spotlight in menu bar
  community.general.osx_defaults:
    domain: com.apple.Spotlight
    key: MenuItemHidden
    type: bool
    value: true
    host: currentHost
  notify: Restart SystemUIServer

- name: System UI | Hide Text Input in menu bar
  community.general.osx_defaults:
    domain: com.apple.TextInputMenu
    key: visible
    type: bool
    value: false
  notify: Restart SystemUIServer

- name: System UI | Hide Text Input status item
  community.general.osx_defaults:
    domain: com.apple.TextInputMenuAgent
    key: NSStatusItem Visible Item-0
    type: bool
    value: false
  notify: Restart SystemUIServer

- name: System UI | Beep on moving the slider
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.sound.beep.feedback
    type: int
    value: 1

- name: System UI | Use 24-hour time format
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleICUForce24HourTime
    type: bool
    value: true
  notify: Restart SystemUIServer

- name: System UI | Use 24-hour time format on login and lock screen
  community.general.osx_defaults:
    domain: /Library/Preferences/.GlobalPreferences
    key: AppleICUForce24HourTime
    type: bool
    value: true
  become: true

- name: System UI | Use 24-hour menu bar clock
  community.general.osx_defaults:
    domain: com.apple.menuextra.clock
    key: Show24Hour
    type: bool
    value: true
  notify: Restart SystemUIServer

- name: System UI | Show date in menu bar clock when space allows
  community.general.osx_defaults:
    domain: com.apple.menuextra.clock
    key: ShowDate
    type: int
    value: 0
  notify: Restart SystemUIServer

- name: System UI | Show day of week in menu bar clock
  community.general.osx_defaults:
    domain: com.apple.menuextra.clock
    key: ShowDayOfWeek
    type: bool
    value: true
  notify: Restart SystemUIServer

- name: System UI | Disable menu bar clock time announcements
  community.general.osx_defaults:
    domain: com.apple.menuextra.clock
    key: TimeAnnouncementsEnabled
    type: bool
    value: false
  notify: Restart SystemUIServer

- name: System UI | Reduce status item spacing
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSStatusItemSpacing
    type: int
    value: 12
    host: currentHost
  notify: Restart SystemUIServer

- name: System UI | Reduce status item selection padding
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSStatusItemSelectionPadding
    type: int
    value: 12
    host: currentHost
  notify: Restart SystemUIServer
