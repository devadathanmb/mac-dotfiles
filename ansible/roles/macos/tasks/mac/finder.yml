---
# FINDER SETTINGS

- name: Finder | Show all filename extensions
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true

- name: Finder | Show full POSIX path in window title
  community.general.osx_defaults:
    domain: com.apple.finder
    key: _FXShowPosixPathInTitle
    type: bool
    value: true

- name: Finder | Hide all desktop icons
  community.general.osx_defaults:
    domain: com.apple.finder
    key: CreateDesktop
    type: bool
    value: false

- name: Finder | Disable warning before changing file extension
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXEnableExtensionChangeWarning
    type: bool
    value: false

- name: Finder | Set default search scope to current folder
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXDefaultSearchScope
    type: string
    value: SCcf

- name: Finder | Show status bar
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowStatusBar
    type: bool
    value: false

- name: Finder | Show path bar
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowPathbar
    type: bool
    value: true

- name: Finder | Use list view as default
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXPreferredViewStyle
    type: string
    value: Nlsv

- name: Finder | Disable warning before emptying Trash
  community.general.osx_defaults:
    domain: com.apple.finder
    key: WarnOnEmptyTrash
    type: bool
    value: false

- name: Finder | Open new windows to Home folder
  community.general.osx_defaults:
    domain: com.apple.finder
    key: NewWindowTarget
    type: string
    value: PfHm

- name: Finder | Don't sync Desktop to iCloud Drive
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXICloudDriveDesktop
    type: bool
    value: false

- name: Finder | Don't sync Documents to iCloud Drive
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXICloudDriveDocuments
    type: bool
    value: false

- name: Finder | Show external drives on Desktop
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowExternalHardDrivesOnDesktop
    type: bool
    value: true

- name: Finder | Hide internal hard drives on Desktop
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowHardDrivesOnDesktop
    type: bool
    value: false

- name: Finder | Show removable media on Desktop
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowRemovableMediaOnDesktop
    type: bool
    value: true

- name: Finder | Show sidebar
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowSidebar
    type: bool
    value: true

- name: Finder | Set sidebar width
  community.general.osx_defaults:
    domain: com.apple.finder
    key: SidebarWidth
    type: float
    value: 139.0

- name: Finder | Set secondary sidebar width
  community.general.osx_defaults:
    domain: com.apple.finder
    key: SidebarWidth2
    type: float
    value: 164.0

- name: Finder | Group icon view by name
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXArrangeGroupViewBy
    type: string
    value: Name

- name: Finder | Auto-remove trash items after 30 days
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXRemoveOldTrashItems
    type: bool
    value: true

- name: Finder | Hide recent tags in sidebar
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowRecentTags
    type: bool
    value: false

- name: Finder | Show ~/Library folder
  ansible.builtin.file:
    path: "{{ home_dir }}/Library"
    state: directory
    mode: "0755"
  register: library_folder

- name: Finder | Check if ~/Library folder is hidden
  ansible.builtin.command:
    cmd: "ls -ldO {{ home_dir }}/Library"
  register: library_chflags
  changed_when: false

- name: Finder | Remove hidden flag from ~/Library
  ansible.builtin.command:
    cmd: "chflags nohidden {{ home_dir }}/Library"
  changed_when: true
  when: "'hidden' in library_chflags.stdout"
