---
dotfiles_repo: "{{ lookup('env', 'DOTFILES_REPO') | default(lookup('env', 'HOME') ~ '/.mac-dots', true) }}"

macos_dock_applications:
  - name: Visual Studio Code
    path: /Applications/Visual Studio Code.app
  - name: Ghostty
    path: /Applications/Ghostty.app
  - name: Arc
    path: /Applications/Arc.app
  - name: Google Chrome
    path: /Applications/Google Chrome.app

macos_login_items:
  - name: FluidVoice
    path: /Applications/FluidVoice.app
  - name: Thaw
    path: /Applications/Thaw.app
  - name: LocalSend
    path: /Applications/LocalSend.app
  - name: Raycast
    path: /Applications/Raycast.app
  - name: Snapzy
    path: /Applications/Snapzy.app
  - name: Stats
    path: /Applications/Stats.app
