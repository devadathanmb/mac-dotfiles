---
# yt-x: browse YouTube and other yt-dlp supported sites from the terminal.
# Upstream: https://github.com/Benexl/yt-x
# Runtime deps (yt-dlp, fzf, jq, chafa, mpv) come from homebrew/brew_packages.txt.
# The tracked configs/yt-x files are linked by the dotbot role.

- name: Ensure user-local executable directory exists
  ansible.builtin.file:
    path: "{{ local_bin_dir }}"
    state: directory
    mode: "0755"

- name: Check installed yt-x version
  ansible.builtin.command:
    cmd: "{{ local_bin_dir }}/yt-x --version"
  register: yt_x_installed
  changed_when: false
  failed_when: false

- name: Install pinned yt-x release
  ansible.builtin.get_url:
    url: "https://github.com/Benexl/yt-x/releases/download/v{{ yt_x_version }}/yt-x"
    dest: "{{ local_bin_dir }}/yt-x"
    mode: "0755"
  when: "'v' + yt_x_version not in (yt_x_installed.stdout | default(''))"
