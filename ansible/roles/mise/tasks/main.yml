---
# Mise Version Manager Role
# Installs mise and the configured development runtimes.

- name: Install mise via Homebrew
  community.general.homebrew:
    name: mise
    state: present
  become: false

- name: Install and set development runtimes globally
  ansible.builtin.command:
    cmd: >-
      mise use --global --yes
      python@{{ mise_python_version }}
      node@{{ mise_node_version }}
      bun@{{ mise_bun_version }}
      deno@{{ mise_deno_version }}
      go@{{ mise_go_version }}
      rust@{{ mise_rust_version }}
  register: mise_runtime_use_result
  changed_when: "'installed 0 tools' not in (mise_runtime_use_result.stdout + mise_runtime_use_result.stderr)"

- name: Install AI coding CLIs globally with npm
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
    executable: "{{ lookup('ansible.builtin.env', 'HOME') }}/.local/share/mise/shims/npm"
  loop: "{{ npm_ai_coding_packages }}"
  environment:
    npm_config_allow_scripts: "{{ npm_ai_coding_allow_scripts | join(',') }}"

- name: Refresh mise shims for global npm CLIs
  ansible.builtin.command:
    cmd: mise reshim
  changed_when: false

- name: Display installed versions
  ansible.builtin.debug:
    msg: |
      Mise setup complete!
      {{ mise_runtime_use_result.stdout | default('') }}
      {{ mise_runtime_use_result.stderr | default('') }}
