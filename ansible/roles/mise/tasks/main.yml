---
# Mise Version Manager Role
# Installs mise and applies the global tools declared in the tracked
# configs/mise/config.toml. Dotbot links that file to ~/.config/mise/config.toml.
# Change global tools by editing the tracked config, not with `mise use --global`.

- name: Install mise via Homebrew
  community.general.homebrew:
    name: mise
    state: present
  become: false

- name: Check the tracked mise config is linked
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/mise/config.toml"
  register: mise_global_config

- name: Fail when the tracked mise config is missing
  ansible.builtin.assert:
    that: mise_global_config.stat.exists
    fail_msg: >-
      ~/.config/mise/config.toml is missing. Run `make dotfiles` (or `make mise`,
      which links dotfiles first) before provisioning mise tools.

- name: Install globally configured mise tools
  ansible.builtin.command:
    cmd: mise install
    chdir: "{{ lookup('ansible.builtin.env', 'HOME') }}"
  register: mise_install_result
  changed_when: "'installed 0 tools' not in (mise_install_result.stdout + mise_install_result.stderr)"

- name: Display installed versions
  ansible.builtin.debug:
    msg: |
      Mise setup complete!
      {{ mise_install_result.stdout | default('') }}
      {{ mise_install_result.stderr | default('') }}
