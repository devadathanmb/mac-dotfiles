---
- name: Check Homebrew is available
  ansible.builtin.command:
    cmd: brew --version
  register: homebrew_check
  check_mode: false
  changed_when: false
  failed_when: false

- name: Require Homebrew before installing packages
  ansible.builtin.assert:
    that: homebrew_check.rc == 0
    fail_msg: Run make bootstrap to install Homebrew and Ansible first.

- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true
  become: false

- name: Read Homebrew formulae from file
  ansible.builtin.set_fact:
    brew_formulae: "{{ lookup('file', brew_formulae_file).splitlines() | reject('==', '') | list }}"

- name: Read Homebrew casks from file
  ansible.builtin.set_fact:
    brew_casks: "{{ lookup('file', brew_casks_file).splitlines() | reject('==', '') | list }}"

- name: Install Homebrew formulae
  community.general.homebrew:
    name: "{{ brew_formulae }}"
    state: present
  become: false

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ brew_casks }}"
    state: present
    # Homebrew runs as the user; only privileged installers use sudo.
    # -K is not exposed as ansible_become_password to this module.
    sudo_password: "{{ ansible_become_password | default(lookup('ansible.builtin.env', 'ANSIBLE_BECOME_PASS'), true) | default(omit, true) }}"
  become: false

- name: Resolve Homebrew command conflicts
  ansible.builtin.import_tasks: command_conflicts.yml

- name: Configure default applications
  ansible.builtin.import_tasks: default_applications.yml
