---
- name: Backup Installed Packages and Extensions
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    dotfiles_repo: "{{ lookup('env', 'DOTFILES_REPO') | default(lookup('env', 'HOME') ~ '/.mac-dots', true) }}"
    zed_extensions_installed_dir: "{{ lookup('env', 'HOME') }}/Library/Application Support/Zed/extensions/installed"

  tasks:
    # Homebrew Formulae Backup
    - name: Get top-level Homebrew formulae
      ansible.builtin.command:
        cmd: brew leaves
      register: installed_formulae
      changed_when: false
      tags: formulae

    - name: Write top-level formulae to file
      ansible.builtin.copy:
        content: "{{ installed_formulae.stdout_lines | sort | join('\n') }}{{ '\n' if installed_formulae.stdout_lines | length > 0 else '' }}"
        dest: "{{ dotfiles_repo }}/homebrew/brew_packages.txt"
        mode: "0644"
      tags: formulae

    - name: Display formulae backup result
      ansible.builtin.debug:
        msg: "Backed up {{ installed_formulae.stdout_lines | length }} top-level Homebrew formulae to brew_packages.txt"
      tags: formulae

    # Homebrew Casks Backup
    - name: Discover Homebrew casks
      ansible.builtin.command:
        cmd: brew list --cask
      register: discovered_casks
      changed_when: false
      tags: casks

    - name: Verify Homebrew casks have an installed version
      ansible.builtin.command:
        cmd: "brew list --cask --versions {{ item }}"
      loop: "{{ discovered_casks.stdout_lines | sort }}"
      register: cask_version_checks
      changed_when: false
      failed_when: false
      tags: casks

    - name: Collect installed Homebrew casks
      ansible.builtin.set_fact:
        installed_casks: "{{ cask_version_checks.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | sort | list }}"
      tags: casks

    - name: Write installed casks to file
      ansible.builtin.copy:
        content: "{{ installed_casks | join('\n') }}{{ '\n' if installed_casks | length > 0 else '' }}"
        dest: "{{ dotfiles_repo }}/homebrew/brew_casks.txt"
        mode: "0644"
      tags: casks

    - name: Display casks backup result
      ansible.builtin.debug:
        msg: "Backed up {{ installed_casks | length }} Homebrew casks to brew_casks.txt"
      tags: casks

    # VSCode Extensions Backup
    - name: Check if VSCode is installed
      ansible.builtin.command:
        argv: [code, --version]
      register: code_check
      failed_when: false
      changed_when: false
      tags: vscode

    - name: Get installed VSCode extensions
      ansible.builtin.command:
        cmd: code --list-extensions
      register: vscode_extensions
      changed_when: false
      when: code_check.rc == 0
      tags: vscode

    - name: Write VSCode extensions to file
      ansible.builtin.copy:
        content: "{{ vscode_extensions.stdout_lines | sort | join('\n') }}{{ '\n' if vscode_extensions.stdout_lines | length > 0 else '' }}"
        dest: "{{ dotfiles_repo }}/configs/vscode/extensions.txt"
        mode: "0644"
      when: code_check.rc == 0
      tags: vscode

    - name: Display VSCode extensions backup result
      ansible.builtin.debug:
        msg: "Backed up {{ vscode_extensions.stdout_lines | length }} VSCode extensions to extensions.txt"
      when: code_check.rc == 0
      tags: vscode

    # Zed Extensions Backup
    - name: Check if Zed extensions directory exists
      ansible.builtin.stat:
        path: "{{ zed_extensions_installed_dir }}"
      register: zed_extensions_dir
      tags: zed

    - name: Get installed Zed extensions
      ansible.builtin.command:
        argv:
          - find
          - "{{ zed_extensions_installed_dir }}"
          - -mindepth
          - "1"
          - -maxdepth
          - "1"
          - -type
          - d
          - -exec
          - basename
          - "{}"
          - ";"
      register: zed_extensions
      changed_when: false
      when: zed_extensions_dir.stat.exists
      tags: zed

    - name: Write Zed extensions to file
      ansible.builtin.copy:
        content: "{{ zed_extensions.stdout_lines | sort | join('\n') }}{{ '\n' if zed_extensions.stdout_lines | length > 0 else '' }}"
        dest: "{{ dotfiles_repo }}/configs/zed/extensions.txt"
        mode: "0644"
      when: zed_extensions_dir.stat.exists
      tags: zed

    - name: Display Zed extensions backup result
      ansible.builtin.debug:
        msg: "Backed up {{ zed_extensions.stdout_lines | default([]) | length }} Zed extensions to extensions.txt"
      when: zed_extensions_dir.stat.exists
      tags: zed

    - name: Back up application preferences
      ansible.builtin.command:
        argv:
          - defaults
          - export
          - "{{ item.domain }}"
          - "{{ dotfiles_repo }}/{{ item.path }}"
      loop:
        - domain: com.lwouis.alt-tab-macos
          path: exports/alt-tab/com.lwouis.alt-tab-macos.plist
        - domain: eu.exelban.Stats
          path: exports/stats/Stats.plist
        - domain: com.googlecode.iterm2
          path: exports/iterm2/com.googlecode.iterm2.plist
      loop_control:
        label: "{{ item.domain }}"
      changed_when: true
      tags: apps

    # macOS Defaults Backup
    - name: Refresh latest managed macOS defaults backup
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ dotfiles_repo }}/ansible/scripts/backup_macos_defaults.py"
          - --source-dir
          - "{{ dotfiles_repo }}/ansible/roles/macos/tasks/mac"
          - --output-dir
          - "{{ dotfiles_repo }}/configs/macos/backups"
      register: macos_defaults_backup
      changed_when: true
      tags: macos

    - name: Display macOS defaults backup result
      ansible.builtin.debug:
        msg: "{{ macos_defaults_backup.stdout }}"
      tags: macos

    # Summary
    - name: Display backup summary
      ansible.builtin.debug:
        msg: |
          ========================================
          Backup Complete!
          ========================================
          Homebrew formulae (leaves): {{ installed_formulae.stdout_lines | default([]) | length }}
          Homebrew casks: {{ installed_casks | default([]) | length }}
          VSCode extensions: {{ vscode_extensions.stdout_lines | default([]) | length }}
          Zed extensions: {{ zed_extensions.stdout_lines | default([]) | length }}
          Application preferences: AltTab, Stats, iTerm2
          macOS defaults backup: {{ macos_defaults_backup.stdout | default('not run') }}
          ========================================
          Run `git diff` to see changes, then `git add` and `git commit` to save.
