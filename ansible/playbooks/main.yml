---
- name: Dotfiles Setup
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  vars_prompt:
    - name: bootstrap_sudo_password
      prompt: BECOME password
      private: true

  vars:
    ansible_become_password: "{{ bootstrap_sudo_password }}"

  roles:
    - role: opencode
      tags: [opencode, secrets]
    - role: dotbot
      tags: [dotbot, symlinks]
    - role: homebrew
      tags: [homebrew, packages]
    - role: tmux
      tags: [tmux, plugins]
    - role: mise
      tags: [mise, python, node]
    - role: macos
      tags: [macos, defaults]
    - role: zsh
      tags: [zsh]
    - role: editors
      tags: [editors, vscode, zed]
