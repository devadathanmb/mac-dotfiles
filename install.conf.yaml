- defaults:
    link:
      relink: true # Removes old links even if they point to the correct target
      create: true # Create parent dirs if needed
      force: true # Remove existing file and create with a symlink

- clean: ["~"]

# Format like:
# Actual path: your dotfiles repo reference
- link:
    ~/.tmux.conf: .tmux.conf
    ~/.vimrc: .vimrc
    ~/.ideavimrc: .ideavimrc
    ~/.curlrc: .curlrc
    ~/.psqlrc: .psqlrc
    ~/.wgetrc: .wgetrc
    ~/.p10k.zsh: .p10k.zsh
    ~/.gitconfig: .gitconfig
    ~/.zshrc: .zshrc
    ~/.config/fish: configs/fish
    ~/.zprofile: .zprofile
    ~/.config/gh: configs/gh
    ~/.config/zsh: configs/zsh
    ~/.config/nvim: configs/nvim
    ~/.config/ghostty: configs/ghostty
    ~/.config/kitty: configs/kitty
    ~/.config/atuin: configs/atuin
    ~/.config/pgcli: configs/pgcli
    ~/.config/htop: configs/htop
    ~/.config/btop: configs/btop
    ~/.config/mpv: configs/mpv
    ~/.config/mise/config.toml: configs/mise/config.toml
    ~/.config/zed: configs/zed
    ~/.config/opencode/AGENTS.md: configs/opencode/AGENTS.md
    ~/.config/opencode/cli.json: configs/opencode/cli.json
    ~/.config/opencode/opencode-quota/quota-toast.jsonc: configs/opencode/opencode-quota/quota-toast.jsonc
    ~/.config/opencode/opencode.jsonc: configs/opencode/opencode.jsonc
    ~/.config/opencode/themes/github-dark-default.json: configs/opencode/themes/github-dark-default.json
    ~/.config/snapzy/config.toml: configs/snapzy/config.toml
    ~/.codex/AGENTS.md: configs/codex/AGENTS.md
    ~/.claude/:
      glob: true
      path: configs/claude/*
    ~/.local/bin/:
      glob: true
      path: scripts/*/*
    "~/Library/Application Support/Code/User/settings.json": configs/vscode/settings.json
    "~/Library/Application Support/Code/User/keybindings.json": configs/vscode/keybindings.json

    # Obsidian: reusable settings only; notes and workspace state stay in the vault.
    ~/repos/notes/.obsidian/app.json: configs/obsidian/app.json
    ~/repos/notes/.obsidian/appearance.json: configs/obsidian/appearance.json
    ~/repos/notes/.obsidian/community-plugins.json: configs/obsidian/community-plugins.json
    ~/repos/notes/.obsidian/core-plugins.json: configs/obsidian/core-plugins.json
    ~/repos/notes/.obsidian/hotkeys.json: configs/obsidian/hotkeys.json
    ~/repos/notes/.obsidian.vimrc: configs/obsidian/vimrc
    ~/repos/notes/Settings/Keybindings.md: configs/obsidian/Keybindings.md
    ~/repos/notes/.obsidian/snippets/vscode-style.css: configs/obsidian/snippets/vscode-style.css
    ~/repos/notes/.obsidian/plugins/spacekeys/data.json: configs/obsidian/plugins/spacekeys/data.json
    ~/repos/notes/.obsidian/plugins/obsidian-vimrc-support/data.json: configs/obsidian/plugins/obsidian-vimrc-support/data.json
    ~/repos/notes/.obsidian/plugins/sidebar-keyboard-navigation/data.json: configs/obsidian/plugins/sidebar-keyboard-navigation/data.json
    ~/repos/notes/.obsidian/plugins/global-vim-navigation: configs/obsidian/plugins/global-vim-navigation
    ~/repos/notes/.obsidian/plugins/document-comments/data.json: configs/obsidian/plugins/document-comments/data.json

    # Pi Coding Agent
    ~/.pi/agent/settings.json: configs/pi/settings.json
    ~/.pi/agent/keybindings.json: configs/pi/keybindings.json
    ~/.pi/agent/APPEND_SYSTEM.md: configs/pi/APPEND_SYSTEM.md
    ~/.pi/web-search.json: configs/pi/web-search.json
    ~/.pi/agent/extensions: configs/pi/extensions
    ~/.pi/agent/themes: configs/pi/themes
    ~/.pi/agent/npm/package.json: configs/pi/npm/package.json
    ~/.pi/agent/npm/package-lock.json: configs/pi/npm/package-lock.json
    ~/.pi/agent/damage-control.yaml: configs/pi/damage-control.yaml
    ~/.pi/agent/damage-control-rules.yaml: configs/pi/damage-control-rules.yaml
    ~/.config/mcp/mcp.json: configs/mcp/mcp.json

    # Agent skills: single source of truth for all coding agents
    ~/.agents/skills: configs/agents/skills
    ~/.claude/skills: configs/agents/skills

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [python configs/obsidian/install-plugins.py, Installing pinned Obsidian plugins]
